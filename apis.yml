aid: terminal49
url: https://raw.githubusercontent.com/api-evangelist/terminal49/refs/heads/main/apis.yml
name: Terminal49
kind: company
description: Terminal49 is an automated container and ocean-freight tracking platform.
  Its v2 REST API (JSON:API) lets shippers, forwarders, and logistics software track
  Bills of Lading, bookings, and container numbers across global ocean carriers and
  North American rail, returning normalized milestones, ETAs, terminal availability,
  holds, demurrage fees, and last free day, with webhooks for real-time updates.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Container Tracking
- Ocean Freight
- Supply Chain
- Logistics
- Shipping
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
